<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with dark luxury tone -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <!-- Subtle architectural grid / ambient glow -->
  <circle cx="950" cy="180" r="380" fill="#DC2626" fill-opacity="0.08"/>
  <circle cx="200" cy="500" r="300" fill="#FFFFFF" fill-opacity="0.03"/>
  
  <!-- Outer hairline border -->
  <rect x="40" y="40" width="1120" height="550" rx="16" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
  
  <!-- Top Bar / Monospace Status -->
  <text x="80" y="96" fill="#888888" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" letter-spacing="4">STRATEGIC &amp; DIGITAL CONSULTANCY · WORLDWIDE</text>
  <text x="1000" y="96" fill="#666666" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="500" letter-spacing="2">EST. 2017</text>
  <line x1="80" y1="120" x2="1120" y2="120" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  
  <!-- Brand Heading -->
  <text x="80" y="240" fill="#F7F7F4" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="-2">ENIX STUDIO</text>
  
  <!-- Tagline / Value Proposition -->
  <text x="82" y="320" fill="#E5E5E5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">Consultoría Estratégica, Dirección de Arte</text>
  <text x="82" y="365" fill="#E5E5E5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">e Ingeniería Aplicada de Alto Valor</text>
  
  <!-- Subtitle -->
  <text x="82" y="430" fill="#999999" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">Diseñamos la posición dominante de empresas consolidadas, fondos de inversión</text>
  <text x="82" y="460" fill="#999999" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">e industrias de alta complejidad con el respaldo tecnológico de NOVVOR.</text>
  
  <!-- Bottom Capabilities Pills -->
  <line x1="80" y1="510" x2="1120" y2="510" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="80" y="530" width="220" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="96" y="553" fill="#CCCCCC" font-family="'SF Mono', monospace" font-size="12" font-weight="500" letter-spacing="1">STRATEGIC ADVISORY</text>
  
  <rect x="315" y="530" width="200" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="331" y="553" fill="#CCCCCC" font-family="'SF Mono', monospace" font-size="12" font-weight="500" letter-spacing="1">BRAND PERCEPTION</text>
  
  <rect x="530" y="530" width="230" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="546" y="553" fill="#CCCCCC" font-family="'SF Mono', monospace" font-size="12" font-weight="500" letter-spacing="1">DIGITAL PLATFORMS</text>
  
  <rect x="775" y="530" width="245" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="791" y="553" fill="#EF4444" font-family="'SF Mono', monospace" font-size="12" font-weight="600" letter-spacing="1">POWERED BY NOVVOR</text>
</svg>
